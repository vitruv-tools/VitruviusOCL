version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  schedule:
    interval: daily
  commit-message:
    prefix: "Maven"
    include: "scope"
  groups:
    junit:
      patterns:
      - "org.junit.*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "daily"
  commit-message:
    prefix: "GitHub Actions"
    include: "scope"
- package-ecosystem: npm
  directory: "/vitruvocl-vscode-extension"
  schedule:
    interval: daily
  commit-message:
    prefix: "NPM"
    include: "scope"
  ignore:
    # must stay in sync with engines.vscode in package.json (vsce rejects newer types)
    - dependency-name: "@types/vscode"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
