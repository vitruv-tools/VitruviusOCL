# Violation store of the frozen rules in ArchitectureTest. Relative to the module directory,
# which is the working directory of Surefire.
freeze.store.default.path=src/test/archunit_store
# The store is committed; a missing store is an error instead of a silent new baseline.
freeze.store.default.allowStoreCreation=false
# Frozen cycles are matched by their package path, not by the sampled class dependencies.
freeze.lineMatcher=tools.vitruv.dsls.vitruvocl.architecture.CyclePathViolationMatcher

# Report every cycle. If the limit were hit, the subset of reported cycles could vary between
# runs and frozen cycles would come and go in the store.
cycles.maxNumberToDetect=1000
# A few sample dependencies per edge are enough to locate a new cycle and keep the store small.
cycles.maxNumberOfDependenciesPerEdge=3
